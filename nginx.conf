# PersonaLink Nginx 配置模板
# 部署后请修改 server_name；项目路径改变时也要修改 root。

server {
    listen 80;
    listen [::]:80;

    # 仅用 IP 时写：server_name _;
    # 使用域名时写：server_name example.com www.example.com;
    server_name _;

    root /srv/personalink/frontend/dist;
    index index.html;

    # Vue Router history 模式：刷新子页面时仍交给 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 保留完整 /api 路径并转发给只监听本机 3003 端口的 Express。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 对外健康检查；应用自身端口不需要开放到公网。
    location = /health {
        proxy_pass http://127.0.0.1:3003/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 构建产物带内容哈希，可长期缓存。
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public 中的图片通常不带哈希，使用较短缓存。
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
