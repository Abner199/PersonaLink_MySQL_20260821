name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 代码、MySQL 与前端构建
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: '123456'
          MYSQL_DATABASE: personalink
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: personalink
      DB_USER: root
      DB_PASSWORD: '123456'
      ADMIN_INITIAL_PASSWORD: '12345678'

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22 并启用 npm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 核对所有版本号
        run: node scripts/check-release-version.js

      - name: 标签构建时核对标签与项目版本
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.js "$GITHUB_REF_NAME"

      - name: 安装后端生产依赖
        working-directory: backend
        run: npm ci --omit=dev

      - name: 检查全部后端 JavaScript 语法
        run: node scripts/check-backend-syntax.js

      - name: 创建 CI 临时数据库表
        working-directory: backend
        run: npm run db:schema

      - name: 核验仓库教学模拟数据
        working-directory: backend
        run: npm run db:inspect-json

      - name: 导入教学模拟数据到 CI 临时数据库
        working-directory: backend
        run: npm run db:migrate-json

      - name: 核验 CI 临时数据库完整性
        working-directory: backend
        run: npm run db:verify

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端生产文件
        working-directory: frontend
        run: npm run build

      - name: 上传前端构建产物供检查
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14
